; Esempio allineato al config.ini Joyson (solo sezioni mensa / MenuCraft).
; Non copiare password di produzione: usa le tue.

[SETUP]
; 1 = vecchio DB mensa (prenotazioni)
; 2 = MenuCraft (export_cucina via CONNESSIONE_M2)
ini_method=2

[CONNESSIONE]
; Vecchio server (method 1) — opzionale se usi solo method 2
ini_db_name=mensa
ini_db_host=341portal01
ini_db_username=root
ini_db_password=root
ini_db_smtpKSS=eusmtprelay.corp.joysonsafety.com

[CONNESSIONE_M2]
; DB MenuCraft
ini_db_name2=menucraft
ini_db_host2=u341web03
ini_db_username2=testvb
ini_db_password2=***
; aziende.id numerico (come nel tuo INI: 5) oppure slug (aurora-welfare)
ini_company=5

[MENSACONFIG]
ini_mensa_enabled=Y
ini_send_file=Y
; reminder: mattina = pasto oggi; pomeriggio = primo giorno utile (prima di limite_domani)
hour_ini_reminder=09:10
hour_ini_reminder2=13:40
hour_ini_menu=22:16
day_ini_menu=Monday

[EXCEL]
; → ini_nomeFile, ini_pathSave, ini_fileFormat in SetIni
nameFile=mensa
ini_fileFormat=.xlsx
pathFile=\\341repo01\storage\file_inviati\

[ORARIO_INVIO]
; → ini_oraInvio (timer sera: crea Excel + mail)
oraInvio_ini=21:56
ini_oraInvioCtrl_ini=13:29

[DESTINATARI]
; SetIni raccoglie le righe mail=...
mail=luca.bianconi@joysonsafety.com
